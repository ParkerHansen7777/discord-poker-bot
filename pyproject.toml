
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-poker-bot"
version = "0.1.0"
description = "A Discord-based Texas Hold'em poker bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7",
    "aiosqlite>=0.22",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
